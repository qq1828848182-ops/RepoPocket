          PY
      - name: Reconstruct private inputs only in runner temporary storage
        env:
          RPP_LOCAL_MANIFEST: ${{ secrets.RPP_LOCAL_MANIFEST }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64
          root=pathlib.Path('/tmp/rpp-private-inputs');root.mkdir()
          for m in json.loads(os.environ['RPP_LOCAL_MANIFEST']):
              directory=root/str(m['index']);directory.mkdir()
              encoded=''.join(pathlib.Path('/tmp/rpp-local-chunks','RPP_LOCAL_'+str(m['index'])+'_'+str(i)).read_text() for i in range(m['chunks']))
              (directory/m['name']).write_bytes(base64.b85decode(encoded))
          PY
      - name: Compile and run production Swift engine on private local inputs
        run: |
          swiftc -import-objc-header Vendor/DebCodecs/DebCodecs.h /tmp/repopocket-deb-control-tests/*.o RepoPocket/DebControlEditor.swift DebControlEditorTests/LocalSamples.swift -lz -o /tmp/rpp-local-harness
          /tmp/rpp-local-harness
          brew install dpkg
          python3 DebControlEditorTests/verify-local.py
      - name: Remove private input and output files
        if: always()
        run: rm -rf /tmp/rpp-private-inputs /tmp/rpp-private-outputs /tmp/rpp-private-repaired /tmp/rpp-local-chunks
