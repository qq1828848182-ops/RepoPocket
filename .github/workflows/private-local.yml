name: Private local deb validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: sh DebControlEditorTests/run-macos.sh
      - run: mkdir -p /tmp/rpp-local-chunks
      - name: Stage masked local input chunk group 0
        env:
          RPP_LOCAL_0_0: ${{ secrets.RPP_LOCAL_0_0 }}
          RPP_LOCAL_1_0: ${{ secrets.RPP_LOCAL_1_0 }}
          RPP_LOCAL_1_1: ${{ secrets.RPP_LOCAL_1_1 }}
        run: |
          python3 - <<'PY'
          import os,pathlib
          for k,v in os.environ.items():
              if k.startswith('RPP_LOCAL_'): pathlib.Path('/tmp/rpp-local-chunks',k).write_text(v)
          PY
